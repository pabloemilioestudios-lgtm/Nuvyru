<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuvyru</title>
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--surf:#fff;--s2:#f2f2f5;--ink:#0a0a0a;--mute:#6b6b78;--line:#e6e6ea;--vio:#7c3aed;--warm:#ff5a1f;--grad:linear-gradient(135deg,#a152ff,#3d7bff 55%,#00cfff)}
:root[data-theme=dark]{--bg:#000;--surf:#0c0c0f;--s2:#1a1a1f;--ink:#fff;--mute:#9a9aa8;--line:#25252b;--vio:#a152ff}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,.brand{font-family:Sora,system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:0.1875rem solid #00cfff;outline-offset:0.125rem;border-radius:0.625rem}
.top{position:fixed;top:0;left:0;right:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0)}
.top>div{max-width:42.5rem;margin:0 auto;height:3.5rem;display:flex;align-items:center;gap:0.375rem;padding:0 0.75rem}
.brand{display:flex;align-items:center;gap:0.5rem;font-weight:800;font-size:1.25rem;flex:1}.brand img{width:1.75rem;height:1.75rem}
.ib{width:2.625rem;height:2.625rem;border-radius:50%;display:grid;place-items:center;flex:none}.ib:hover{background:var(--s2)}
.ib svg{width:1.375rem;height:1.375rem}.ib img{width:1.625rem;height:1.625rem}
.livebtn{display:flex;align-items:center;gap:0.4375rem;height:2.125rem;padding:0 0.8125rem;border-radius:62.4375rem;background:var(--s2);font-weight:700;font-size:0.8125rem}
.livebtn i{width:0.5rem;height:0.5rem;border-radius:50%;background:var(--warm);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
main{height:100dvh;overflow-y:auto;padding:4.25rem 0 8.125rem}
.wrap{max-width:42.5rem;margin:0 auto;padding:0 0.875rem}
.enter{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(0.5rem)}}
.proto{border:1px dashed var(--line);border-radius:0.75rem;padding:0.5rem 0.75rem;font-size:0.78125rem;color:var(--mute);margin:0.625rem 0}
h1{font-size:1.5rem;margin:0.625rem 0 0.75rem;letter-spacing:-.02em}h2{font-size:1rem;margin:1.25rem 0 0.5rem}
.card{background:var(--surf);border:1px solid var(--line);border-radius:1.125rem;padding:0.875rem;margin-bottom:0.75rem}
.row{display:flex;align-items:center;gap:0.75rem}.sp{flex:1}
.av{width:2.625rem;height:2.625rem;border-radius:50%;background:var(--grad);flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-family:Sora}
.strip{display:flex;gap:0.875rem;overflow-x:auto;padding:0.375rem 0.25rem 0.75rem}
.story{width:4.125rem;text-align:center;font-size:0.75rem;flex:none}
.story .av{width:3.625rem;height:3.625rem;margin:0 auto 0.25rem;box-shadow:0 0 0 0.1875rem var(--bg),0 0 0 0.3125rem var(--vio)}.story.seen .av{box-shadow:0 0 0 0.1875rem var(--bg),0 0 0 0.3125rem var(--line)}
.mute{color:var(--mute);font-size:0.875rem}
.media{aspect-ratio:1;margin:0.75rem -0.875rem;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:0.8125rem;position:relative;user-select:none;touch-action:manipulation}
.pop{position:absolute;inset:0;display:grid;place-items:center;font-size:6rem;color:#fff;text-shadow:0 0.25rem 1.5rem #0008;animation:pop .7s forwards;pointer-events:none}
@keyframes pop{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:0}}
.acts{display:flex;gap:0.25rem;flex-wrap:wrap}
.act{display:flex;gap:0.375rem;align-items:center;padding:0.5rem 0.625rem;border-radius:62.4375rem;color:var(--mute);font-weight:600;font-size:0.875rem}.act:hover{background:var(--s2);color:var(--ink)}
.act[aria-pressed=true]{color:var(--warm)}.act svg{width:1.25rem;height:1.25rem}
.btn{background:var(--ink);color:var(--bg);font-weight:700;padding:0.6875rem 1.25rem;border-radius:62.4375rem}.btn.ghost{background:var(--s2);color:var(--ink)}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--s2);border:1px solid var(--line);border-radius:0.875rem;padding:0.75rem 0.875rem}
.chips{display:flex;gap:0.5rem;flex-wrap:wrap;margin:0.5rem 0}
.chip{padding:0.5rem 0.875rem;border-radius:62.4375rem;background:var(--s2);font-weight:600;font-size:0.875rem}.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.1875rem;margin:0 -0.875rem 0.75rem}.grid div{aspect-ratio:1}
.reels{display:flex;flex-direction:column;gap:0.75rem;height:calc(100dvh - 9.375rem);min-height:26.25rem;overflow-y:auto;scroll-snap-type:y mandatory}
.reel{height:100%;flex:none;scroll-snap-align:start;border-radius:1.5rem;color:#fff;padding:1.25rem;display:flex;flex-direction:column;justify-content:flex-end;position:relative;background:linear-gradient(160deg,#1b1060,#3d7bff 60%,#00cfff)}
.side{z-index:1;position:absolute;right:0.75rem;bottom:5.625rem;display:flex;flex-direction:column;gap:0.625rem}.side button{width:2.875rem;height:2.875rem;border-radius:50%;background:#0006;display:grid;place-items:center;color:#fff}
.bubble{max-width:80%;padding:0.625rem 0.875rem;border-radius:1.125rem;background:var(--s2);margin:0.375rem 0;width:fit-content}.bubble.me{background:var(--ink);color:var(--bg);margin-left:auto}
.bar-meter{height:0.5rem;border-radius:0.5625rem;background:var(--s2);overflow:hidden}.bar-meter i{display:block;height:100%;background:var(--grad);transition:width .4s}
.pet{animation:bob 3.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-0.3125rem)}}
.live-box{aspect-ratio:16/9;border-radius:1.125rem;background:#05081a;display:grid;place-items:center;color:#9a9ccd;overflow:hidden}.live-box video{width:100%;height:100%;object-fit:cover}
.todo{display:flex;gap:0.625rem;padding:0.5rem 0;border-top:1px solid var(--line);font-size:0.875rem}.todo b{color:var(--warm);flex:none}
.badges{display:flex;gap:0.875rem;overflow-x:auto;padding-bottom:0.5rem}.badge{text-align:center;font-size:0.75rem;flex:none;width:5.25rem}.badge.locked{opacity:.35;filter:grayscale(1)}
/* Barra inferior colapsable */
.fab{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0));transform:translateX(-50%);width:2.75rem;height:2.75rem;border-radius:50%;background:var(--surf);border:1px solid var(--line);display:grid;place-items:center;z-index:8;box-shadow:0 0.25rem 0.875rem #0002;opacity:.92;transition:left .4s cubic-bezier(.3,.9,.3,1),transform .4s cubic-bezier(.3,.9,.3,1),opacity .3s}
.fab.mini{left:100%;transform:translateX(calc(-100% - 0.75rem)) scale(.6);opacity:.5}.fab.mini:hover,.fab.mini:focus-visible{opacity:1}
.fab>*{grid-area:1/1;transition:transform .35s,opacity .2s}.fab img{width:1.5rem}.fab svg{width:1.25rem;color:var(--ink);opacity:0;transform:rotate(-90deg) scale(.4)}
.fab[aria-expanded=true] img{opacity:0;transform:rotate(90deg) scale(.4)}.fab[aria-expanded=true] svg{opacity:1;transform:none}
.bar{position:fixed;left:50%;bottom:calc(4.5rem + env(safe-area-inset-bottom,0));display:flex;align-items:center;gap:0.25rem;padding:0.5rem;border-radius:2rem;background:var(--surf);border:1px solid var(--line);box-shadow:0 1rem 2.75rem #0003;z-index:7;transform:translate(-50%,1.625rem) scale(.8);opacity:0;visibility:hidden;transition:transform .3s,opacity .2s,visibility 0s .3s}
.bar.on{transform:translate(-50%,0) scale(1);opacity:1;visibility:visible;transition:transform .4s cubic-bezier(.2,.9,.3,1.25),opacity .2s,visibility 0s}
.bar button{display:flex;flex-direction:column;align-items:center;gap:0.1875rem;padding:0.625rem 0.75rem;border-radius:1.25rem;font-size:0.6875rem;font-weight:600;color:var(--mute);opacity:0;transform:translateY(0.625rem);transition:opacity .25s,transform .25s}
.bar.on button{opacity:1;transform:none;transition-delay:calc(var(--i)*50ms + 90ms)}
.bar button svg{width:1.5rem;height:1.5rem}.bar button[aria-current=page]{color:var(--ink);background:var(--s2)}
.bar .vid{background:var(--grad);color:#fff;padding:0.75rem 1rem;border-radius:1.375rem}.bar .vid[aria-current=page]{background:var(--grad);color:#fff}
/* Panel de ajustes */
.sheet{position:fixed;inset:0;z-index:20;visibility:hidden;transition:visibility 0s .3s}.sheet.on{visibility:visible;transition-delay:0s}
.sheet .bd{position:absolute;inset:0;background:#0007;opacity:0;transition:opacity .3s}.sheet.on .bd{opacity:1}
.sheet .pn{position:absolute;right:0;top:0;bottom:0;width:min(22.5rem,88vw);background:var(--bg);padding:calc(1rem + env(safe-area-inset-top,0)) 1.125rem 1.25rem;transform:translateX(100%);transition:transform .3s;overflow:auto}.sheet.on .pn{transform:none}
.toast{position:fixed;left:50%;bottom:6.25rem;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:0.625rem 1.125rem;border-radius:62.4375rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;font-size:0.875rem}.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}

body.vmode main{padding:0;overflow:hidden;background:#000}
body.vmode .wrap{max-width:none;padding:0}
body.vmode .top{background:linear-gradient(#000b,transparent);border-color:transparent;color:#fff}
body.vmode .livebtn{background:#ffffff26;color:#fff}
.reels{height:100dvh;min-height:0;gap:0;background:#000}
.reel{height:100dvh;border-radius:0;width:min(100%,30rem);margin:0 auto;padding:0 1rem calc(6rem + env(safe-area-inset-bottom,0));overflow:hidden;cursor:pointer}
.reel.dr{background-size:220% 220%!important;animation:drift 9s ease-in-out infinite}@keyframes drift{50%{background-position:100% 100%}}
.reel .cap{position:relative;z-index:1;max-width:calc(100% - 4.375rem);text-shadow:0 1px 0.375rem #0008}
.reel .snd{opacity:.85;font-size:0.8125rem;margin-top:0.375rem}.reel .ph{opacity:.7;font-size:0.75rem;margin-top:0.375rem}
.reel .side{right:0.625rem;bottom:calc(6.875rem + env(safe-area-inset-bottom,0));gap:0.875rem;align-items:center}
.sb{display:flex;flex-direction:column;align-items:center;gap:0.1875rem;font-size:0.75rem;font-weight:600;color:#fff;text-shadow:0 1px 0.25rem #0008}
.side button[aria-pressed=true]{color:var(--warm)}
.vtabs{position:fixed;top:calc(3.625rem + env(safe-area-inset-top,0));left:0;right:0;z-index:6;display:flex;justify-content:center;gap:1.375rem}
.vtabs button{color:#fff;opacity:.6;font-weight:700;padding:0.375rem 0.125rem;border-bottom:0.125rem solid transparent;text-shadow:0 1px 0.25rem #0008}.vtabs button[aria-pressed=true]{opacity:1;border-color:#fff}
body.noauth .fab,body.noauth .bar,body.noauth .top .ib,body.noauth .top .livebtn{display:none}

html{font-size:16px}
html[data-device=tablet]{font-size:17px}
html[data-device=tv]{font-size:clamp(20px,1.25vw,36px)}
.feed{display:block}
html[data-device=tablet] .wrap{max-width:52rem}
html[data-device=tablet] .feed{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;align-items:start}
html[data-device=tablet] .feed .card,html[data-device=tv] .feed .card{margin:0}
html[data-device=desktop] .wrap{max-width:44rem}
html[data-device=desktop] .card:hover{border-color:var(--mute)}
html[data-device=tv] .wrap,html[data-device=tv] .top>div{max-width:none;padding-left:3vw;padding-right:3vw}
html[data-device=tv] .feed{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;align-items:start}
html[data-device=tv] :focus{outline:.2rem solid #00cfff;outline-offset:.2rem}
html[data-device=tv] button:focus{transform:scale(1.06)}
html[data-device=tv] main{scrollbar-width:none}
html[data-device=phone][data-orient=land] .top>div{height:2.75rem}
html[data-device=phone][data-orient=land] main{padding-top:3.4rem}
.egg{animation:wob 2.6s ease-in-out infinite;transform-origin:50% 92%}@keyframes wob{0%,100%{transform:rotate(0)}30%{transform:rotate(-5deg)}70%{transform:rotate(5deg)}}
.chip:disabled{opacity:.4;cursor:default}
.toast{width:max-content;max-width:calc(100vw - 2rem);text-align:center}
</style>
<script>
(function(){var R=document.documentElement;
function pick(){var o=null;try{o=new URLSearchParams(location.search).get('device')||localStorage.getItem('nv-device')}catch(e){}
 if(['phone','tablet','desktop','tv'].indexOf(o)>-1)return o;
 var w=innerWidth,h=innerHeight,ua=navigator.userAgent,mm=function(q){return matchMedia(q).matches},coarse=mm('(pointer:coarse)'),hover=mm('(hover:hover)');
 if(/SmartTV|Smart-TV|Tizen|Web0S|WebOS|AppleTV|GoogleTV|Android TV|AFTB|AFTS|AFTM|BRAVIA|CrKey|Roku|HbbTV|NetCast|VIDAA|PhilipsTV|Hisense/i.test(ua)||(w>=1920&&!hover&&!coarse))return 'tv';
 if((Math.min(w,h)<500&&(coarse||w<700))||(coarse&&w<600))return 'phone';
 if(w<1024||(coarse&&!hover&&w<1400))return 'tablet';
 return 'desktop'}
function apply(){R.dataset.device=pick();R.dataset.orient=innerWidth>innerHeight?'land':'port'}
window.nvDetect=apply;apply();addEventListener('resize',apply);addEventListener('orientationchange',apply)})();
</script>
</head>
<body>
<header class="top"><div>
 <button class="brand" data-go="home" aria-label="Inicio"><img src="assets/logo.png" alt="">Nuvyru</button>
 <button class="livebtn" data-go="live"><i></i>LIVE</button>
 <button class="ib" data-go="orya" aria-label="Orya AI"><img src="assets/orya.png" alt=""></button>
 <button class="ib" data-go="find" aria-label="Descubrir" id="pb"></button>
</div></header>
<main id="main" tabindex="-1"><div class="wrap" id="view"></div></main>
<nav class="bar" id="bar" aria-label="Principal"></nav>
<button class="fab" id="fab" aria-expanded="false" aria-controls="bar" aria-label="Abrir navegación"><img src="assets/logo.png" alt=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
<div class="sheet" id="sheet"><div class="bd" data-a="closeSheet"></div><aside class="pn" id="pn" role="dialog" aria-label="Ajustes"></aside></div>
<div class="toast" id="toast" role="status"></div>
<script src="assets/config.js"></script>
<script>
const P={home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',find:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',reel:'<path d="M8 5l11 7-11 7z"/>',add:'<path d="M12 5v14M5 12h14"/>',msg:'<path d="M4 5h16v11H9l-5 4z"/>',me:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 4-7 8-7s7 2 8 7"/>',menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',like:'<path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/>',rep:'<path d="M4 9l3-3 3 3M7 6v8a3 3 0 0 0 3 3h7M20 15l-3 3-3-3M17 18v-8a3 3 0 0 0-3-3H7"/>',save:'<path d="M6 3h12v18l-6-4-6 4z"/>'};
const ic=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
const PROTO='';
$('#pb').innerHTML=ic('find');
const SPC={nubi:['#a152ff','#00cfff'],lumo:['#ff8a3d','#ff4fa0'],brisa:['#00cfb4','#3d7bff'],zafi:['#3d4bff','#a152ff']};
const SPN={nubi:'Nubi',lumo:'Lumo',brisa:'Brisa',zafi:'Zafi'},STN={cria:'Cría',joven:'Joven',adulto:'Adulto'};
function egg(size=120,close=false){const id='e'+Math.random().toString(36).slice(2,7);return `<svg class="egg" width="${size}" height="${size}" viewBox="0 0 100 100" role="img" aria-label="Huevo de mascota"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9e0ff"/><stop offset="1" stop-color="#9cc9ff"/></linearGradient></defs><path d="M50 8C70 8 82 40 82 62c0 18-14 30-32 30S18 80 18 62C18 40 30 8 50 8z" fill="url(#${id})"/><circle cx="40" cy="46" r="5" fill="#a152ff" opacity=".5"/><circle cx="60" cy="62" r="7" fill="#00cfff" opacity=".5"/><circle cx="44" cy="74" r="4" fill="#a152ff" opacity=".4"/>${close?'<path d="M30 40l10 8-8 8 12 8" stroke="#14103a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>':''}</svg>`}
function pet(p,size=120){const [c1,c2]=SPC[p.species]||SPC.nubi,id='g'+Math.random().toString(36).slice(2,7),sleepy=p.energy!==undefined&&p.energy<35,sc={cria:.82,joven:.95,adulto:1.05}[p.stage]||1;
 const feat={nubi:`<path d="M30 24q-4-12 6-14M70 24q4-12-6-14" stroke="${c1}" stroke-width="5" fill="none" stroke-linecap="round"/>`,lumo:`<path d="M24 36L22 8l18 14zM76 36L78 8 60 22z" fill="${c1}"/>`,brisa:`<path d="M50 20q-12-14 2-18 10 8-2 18zM20 58q-14 0-12 14 12-2 14-10zM80 58q14 0 12 14-12-2-14-10z" fill="${c1}"/>`,zafi:'<path d="M43 22l7-20 7 20z" fill="#ffd166"/>'}[p.species]||'';
 const eyes=sleepy?'<path d="M33 52q5 4 10 0M57 52q5 4 10 0" stroke="#14103a" stroke-width="3" fill="none" stroke-linecap="round"/>':'<circle cx="38" cy="52" r="5" fill="#14103a"/><circle cx="62" cy="52" r="5" fill="#14103a"/><circle cx="40" cy="50" r="1.8" fill="#fff"/><circle cx="64" cy="50" r="1.8" fill="#fff"/>';
 const mouth=sleepy?'<path d="M44 66q6 3 12 0" stroke="#14103a" stroke-width="3" fill="none" stroke-linecap="round"/>':'<path d="M42 62q8 10 16 0" stroke="#14103a" stroke-width="3" fill="none" stroke-linecap="round"/>';
 const acc={hat:'<path d="M38 22l12-20 12 20z" fill="#ff5a1f"/>',glasses:'<circle cx="38" cy="52" r="8" fill="none" stroke="#14103a" stroke-width="2.5"/><circle cx="62" cy="52" r="8" fill="none" stroke="#14103a" stroke-width="2.5"/><path d="M46 52h8" stroke="#14103a" stroke-width="2.5"/>',scarf:'<path d="M24 68q26 14 52 0l3 9q-29 14-58 0z" fill="#ff5a1f"/>'}[p.accessory]||'';
 const stars=p.stage==='adulto'?'✦✦':p.stage==='joven'?'✦':'';
 return `<svg class="pet" width="${size}" height="${size}" viewBox="0 0 100 100" role="img" aria-label="${esc(p.name||'Mascota')}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><g transform="translate(50 76) scale(${sc}) translate(-50 -76)">${feat}<path d="M20 70c-6-26 6-52 30-52s36 26 30 52c-2 10-58 10-60 0z" fill="url(#${id})"/><circle cx="30" cy="62" r="5" fill="#ff5a1f" opacity=".5"/><circle cx="70" cy="62" r="5" fill="#ff5a1f" opacity=".5"/>${eyes}${mouth}<text x="50" y="40" text-anchor="middle" font-size="9" fill="#fff">${stars}</text>${acc}</g></svg>`}
const TIER={Bronce:['#c98a5a','#7a4a26'],Plata:['#e3e7f3','#8a93b3'],Oro:['#ffd166','#c98a00'],Platino:['#d6f3ff','#6fb5d6'],Diamante:['#8df3ff','#a152ff']};
function medal(t,s,z=64){const [a,b]=TIER[t],id='m'+Math.random().toString(36).slice(2,7);return `<svg width="${z}" height="${z}" viewBox="0 0 72 72" role="img" aria-label="Medalla ${t}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><path d="M36 4l26 12v22c0 14-11 26-26 30C21 64 10 52 10 38V16z" fill="url(#${id})"/><path d="M36 12l18 8v17c0 10-8 19-18 22-10-3-18-12-18-22V20z" fill="#0003"/><text x="36" y="44" text-anchor="middle" font-size="24" fill="#fff">${s}</text></svg>`}

const VIDEOS=[];
const GR=['linear-gradient(160deg,#1b1060,#7c3aed,#00cfff)','linear-gradient(160deg,#0b1a4a,#3d7bff,#a152ff)','linear-gradient(160deg,#2a0a5e,#a152ff,#ff5a1f)'];

 else if(a==='publish'){const t=$('#txt').value.trim();if(!t){toast('Escribe algo antes de publicar');return}const vis=document.querySelector('.vis [aria-pressed=true]').dataset.v;b.disabled=true;try{await api('/api/posts',{method:'POST',body:{body:t,visibility:vis}});toast('Publicado');go('home')}catch(err){toast(err.message)}b.disabled=false}

 else if(a==='petreq'){b.disabled=true;try{const x=await api('/api/pet/request',{method:'POST'});PET=x.pet;PETT=Date.now();PLOG=[];go(cur);toast('Solicitud enviada: tu huevo eclosionará en 4 horas')}catch(err){toast(err.message)}b.disabled=false}
 else if(a==='petretry'){PET=undefined;PERR=null;go(cur)}
 else if(a==='careopen'){S.care=!S.care;go(cur)}
 else if(a==='care'){b.disabled=true;try{const was=PET.stage,x=await api('/api/pet/care',{method:'POST',body:{action:d.t}});PET=x.pet;PETT=Date.now();PLOG.push(['me',LBL[d.t]],['o',LINES[d.t]+(x.gained?'':' (hoy ya llegamos al máximo de progreso, ¡sin prisa!)')]);if(PET.stage!==was)PLOG.push(['o','¡He evolucionado a '+STN[PET.stage]+'! ✦']);go(cur)}catch(err){toast(err.message);if(err.status===429)loadPet()}}
 else if(a==='petset')sheet(true,'pet');
 else if(a==='petname')petPatch({name:$('#pname').value});
 else if(a==='petacc')petPatch({accessory:d.v});
 else if(a==='petshow')petPatch({show_on_profile:b.checked});
 else if(a==='petrem')petPatch({reminders:b.checked});
 else if(a==='petrest')petPatch({rest_mode:b.checked});
 else if(a==='petrelease'){if(!confirm('¿Liberar a '+PET.name+'? Perderás su progreso y no se puede deshacer.'))return;try{await api('/api/pet',{method:'DELETE'});PET=null;PLOG=[];sheet(false);go(cur);toast('Mascota liberada')}catch(err){toast(err.message)}}
 else if(a==='amode'){S.amode=d.m;go('auth')}
 else if(a==='authgo'){const reg=S.amode==='reg',er=$('#aerr');er.textContent='';const bd={username:$('#au').value.trim(),password:$('#ap').value};if(reg){bd.display_name=$('#ad').value.trim();bd.birth_year=+$('#ab').value;if(!$('#at').checked){er.textContent='Debes aceptar los términos para continuar';return}}b.disabled=true;try{const x=await api(reg?'/api/auth/register':'/api/auth/login',{method:'POST',body:bd});TOKEN=x.token;ME=x.user;try{localStorage.setItem('nv-token',TOKEN)}catch(_){}document.body.classList.remove('noauth');go('home')}catch(err){er.textContent=err.message}b.disabled=false}
 else if(a==='logout'){try{await api('/api/auth/logout',{method:'POST'})}catch(_){}logout()}
 else if(a==='retry'){FEED=null;FERR=null;go('home')}
 else if(a==='delpost'){if(!confirm('¿Eliminar esta publicación?'))return;try{await api('/api/posts/'+d.id,{method:'DELETE'});FEED=FEED&&FEED.filter(q=>q.id!==d.id);PF=PF&&PF.filter(q=>q.id!==d.id);go(cur);toast('Publicación eliminada')}catch(err){toast(err.message)}}
 else if(a==='editbio'){const bio=prompt('Tu biografía (máximo 160 caracteres)',ME.bio||'');if(bio===null)return;try{ME=(await api('/api/me',{method:'PATCH',body:{bio}})).user;go('me')}catch(err){toast(err.message)}}
 else if(a==='ask'){const i=$('#oi'),t=d.t||i.value.trim();if(!t)return;$('#oc').insertAdjacentHTML('beforeend',`<div class="bubble me">${esc(t)}</div><div class="bubble">Todavía no puedo responder: falta conectar el Worker y el proveedor de modelos. No voy a inventar una respuesta.</div>`);i.value=''}
 else if(a==='cam'){try{const s=await navigator.mediaDevices.getUserMedia({video:true,audio:true});const v=document.createElement('video');v.muted=true;v.autoplay=true;v.playsInline=true;v.srcObject=s;$('#lv').replaceChildren(v);toast('Vista previa local activa')}catch(err){toast('Permiso de cámara o micrófono denegado')}}
 else if(a==='vlike'){S.liked[d.k]=!S.liked[d.k];b.setAttribute('aria-pressed',!!S.liked[d.k]);b.nextElementSibling.textContent=fmt(+d.l+(S.liked[d.k]?1:0))}
 else if(a==='vtab'){S.vtab=d.t;go('reels')}
 else if(a==='vmute'){const vs=[...document.querySelectorAll('.reel video')];if(!vs.length){toast('Los videos de ejemplo no tienen sonido');return}const m=!vs[0].muted;vs.forEach(x=>x.muted=m);toast(m?'Sonido desactivado':'Sonido activado')}
 else if(a==='upv')$('#vf').click();
 else if(a==='golive')toast('Transmitir requiere el backend LIVE (Fase 7)');
 else if(a==='del'){const pw=prompt('Para eliminar tu cuenta escribe tu contraseña. Esta acción no se puede deshacer.');if(!pw)return;try{await api('/api/me',{method:'DELETE',body:{password:pw}});toast('Cuenta eliminada');logout()}catch(err){toast(err.message)}}
 else if(a==='menu')toast('Denunciar y bloquear se conectan en la Fase 3');
 else toast('Esta función llega en una fase posterior');
});
document.addEventListener('change',e=>{if(e.target.id!=='vf')return;const f=e.target.files[0];if(!f)return;if(!f.type.startsWith('video/')){toast('Solo se admiten archivos de video');return}if(f.size>200*1024*1024){toast('El video supera 200 MB');return}VIDEOS.unshift({t:f.name.replace(/\.[^.]+$/,''),u:'tuusuario',tags:'#nuvyru',l:0,src:URL.createObjectURL(f)});go('reels');toast('Video cargado solo en tu dispositivo')});
function spatial(dir){const els=[...document.querySelectorAll('button,input,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled&&x.offsetParent!==null&&x.getBoundingClientRect().width>0);
 const a=document.activeElement,cu=els.includes(a)?a:null;if(!cu){if(els[0])els[0].focus();return}
 const c=cu.getBoundingClientRect(),cx=c.left+c.width/2,cy=c.top+c.height/2;let best=null,bs=1e9;
 for(const x of els){if(x===cu)continue;const q=x.getBoundingClientRect(),dx=q.left+q.width/2-cx,dy=q.top+q.height/2-cy;
  const ok=dir==='ArrowRight'?dx>4&&Math.abs(dy)<=dx*1.5:dir==='ArrowLeft'?dx<-4&&Math.abs(dy)<=-dx*1.5:dir==='ArrowDown'?dy>4&&Math.abs(dx)<=dy*1.5:dy<-4&&Math.abs(dx)<=-dy*1.5;
  if(!ok)continue;const sc=Math.hypot(dx,dy)+((dir==='ArrowLeft'||dir==='ArrowRight')?Math.abs(dy):Math.abs(dx))*2;if(sc<bs){bs=sc;best=x}}
 if(best){best.focus();best.scrollIntoView({block:'nearest',inline:'nearest'})}}
document.addEventListener('keydown',e=>{const t=document.activeElement,typing=t&&/^(INPUT|TEXTAREA)$/.test(t.tagName),dev=document.documentElement.dataset.device;
 if(e.key==='Escape'||e.key==='GoBack'||e.keyCode===10009||e.keyCode===461){const open=$('#bar').classList.contains('on')||$('#sheet').classList.contains('on');bar(false);sheet(false);if(!open&&cur!=='home'&&ME&&(e.key!=='Escape'||dev==='tv'))go('home');return}
 if(typing)return;
 if(cur==='reels'&&['ArrowDown','ArrowUp','j','k','PageDown','PageUp'].includes(e.key)){const rs=$('.reels');if(rs){e.preventDefault();const dn=['ArrowDown','j','PageDown'].includes(e.key);rs.scrollBy({top:(dn?1:-1)*rs.clientHeight,behavior:'smooth'})}return}
 if(dev==='tv'&&e.key.startsWith('Arrow')){e.preventDefault();spatial(e.key)}});
document.addEventListener('dblclick',e=>{const m=e.target.closest('.media,.reel');if(!m||e.target.closest('button'))return;S.liked[m.dataset.k]=true;const h=document.createElement('div');h.className='pop';h.textContent='♥';m.append(h);const lb=m.querySelector('[data-a=vlike]');if(lb){lb.setAttribute('aria-pressed','true');lb.nextElementSibling.textContent=fmt(+lb.dataset.l+1)}setTimeout(()=>{h.remove();if(cur==='home'&&m.classList.contains('media'))go('home')},700)});
async function boot(){let h0='home';try{h0=(location.hash||'#home').slice(1)}catch(e){}
 if(TOKEN){try{ME=(await api('/api/me')).user}catch(e){if(e.status===401){TOKEN=null;try{localStorage.removeItem('nv-token')}catch(_){}}}}
 document.body.classList.toggle('noauth',!ME);go(h0==='auth'?'home':h0)}
boot();
