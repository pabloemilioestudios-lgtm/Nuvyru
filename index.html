<style>

<script>
const P={home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',find:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',reel:'<path d="M8 5l11 7-11 7z"/>',add:'<path d="M12 5v14M5 12h14"/>',msg:'<path d="M4 5h16v11H9l-5 4z"/>',me:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 4-7 8-7s7 2 8 7"/>',menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',like:'<path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/>',rep:'<path d="M4 9l3-3 3 3M7 6v8a3 3 0 0 0 3 3h7M20 15l-3 3-3-3M17 18v-8a3 3 0 0 0-3-3H7"/>',save:'<path d="M6 3h12v18l-6-4-6 4z"/>'};
const ic=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
const PROTO='';
$('#pb').innerHTML=ic('find');
const SPC={nubi:['#a152ff','#00cfff'],lumo:['#ff8a3d','#ff4fa0'],brisa:['#00cfb4','#3d7bff'],zafi:['#3d4bff','#a152ff']};
const SPN={nubi:'Nubi',lumo:'Lumo',brisa:'Brisa',zafi:'Zafi'},STN={cria:'Cría',joven:'Joven',adulto:'Adulto'};
function egg(size=120,close=false){const id='e'+Math.random().toString(36).slice(2,7);return `<svg class="egg" width="${size}" height="${size}" viewBox="0 0 100 100" role="img" aria-label="Huevo de mascota"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9e0ff"/><stop offset="1" stop-color="#9cc9ff"/></linearGradient></defs><path d="M50 8C70 8 82 40 82 62c0 18-14 30-32 30S18 80 18 62C18 40 30 8 50 8z" fill="url(#${id})"/><circle cx="40" cy="46" r="5" fill="#a152ff" opacity=".5"/><circle cx="60" cy="62" r="7" fill="#00cfff" opacity=".5"/><circle cx="44" cy="74" r="4" fill="#a152ff" opacity=".4"/>${close?'<path d="M30 40l10 8-8 8 12 8" stroke="#14103a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>':''}</svg>`}
function pet(p,size=120){const [c1,c2]=SPC[p.species]||SPC.nubi,id='g'+Math.random().toString(36).slice(2,7),sleepy=p.energy!==undefined&&p.energy<35,sc={cria:.82,joven:.95,adulto:1.05}[p.stage]||1;
 const feat={nubi:`<path d="M30 24q-4-12 6-14M70 24q4-12-6-14" stroke="${c1}" stroke-width="5" fill="none" stroke-linecap="round"/>`,lumo:`<path d="M24 36L22 8l18 14zM76 36L78 8 60 22z" fill="${c1}"/>`,brisa:`<path d="M50 20q-12-14 2-18 10 8-2 18zM20 58q-14 0-12 14 12-2 14-10zM80 58q14 0 12 14-12-2-14-10z" fill="${c1}"/>`,zafi:'<path d="M43 22l7-20 7 20z" fill="#ffd166"/>'}[p.species]||'';
 const eyes=sleepy?'<path d="M33 52q5 4 10 0M57 52q5 4 10 0" stroke="#14103a" stroke-width="3" fill="none" stroke-linecap="round"/>':'<circle cx="38" cy="52" r="5" fill="#14103a"/><circle cx="62" cy="52" r="5" fill="#14103a"/><circle cx="40" cy="50" r="1.8" fill="#fff"/><circle cx="64" cy="50" r="1.8" fill="#fff"/>';
 const mouth=sleepy?'<path d="M44 66q6 3 12 0" stroke="#14103a" stroke-width="3" fill="none" stroke-linecap="round"/>':'<path d="M42 62q8 10 16 0" stroke="#14103a" stroke-width="3" fill="none" stroke-linecap="round"/>';
 const acc={hat:'<path d="M38 22l12-20 12 20z" fill="#ff5a1f"/>',glasses:'<circle cx="38" cy="52" r="8" fill="none" stroke="#14103a" stroke-width="2.5"/><circle cx="62" cy="52" r="8" fill="none" stroke="#14103a" stroke-width="2.5"/><path d="M46 52h8" stroke="#14103a" stroke-width="2.5"/>',scarf:'<path d="M24 68q26 14 52 0l3 9q-29 14-58 0z" fill="#ff5a1f"/>'}[p.accessory]||'';
 const stars=p.stage==='adulto'?'✦✦':p.stage==='joven'?'✦':'';
 return `<svg class="pet" width="${size}" height="${size}" viewBox="0 0 100 100" role="img" aria-label="${esc(p.name||'Mascota')}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><g transform="translate(50 76) scale(${sc}) translate(-50 -76)">${feat}<path d="M20 70c-6-26 6-52 30-52s36 26 30 52c-2 10-58 10-60 0z" fill="url(#${id})"/><circle cx="30" cy="62" r="5" fill="#ff5a1f" opacity=".5"/><circle cx="70" cy="62" r="5" fill="#ff5a1f" opacity=".5"/>${eyes}${mouth}<text x="50" y="40" text-anchor="middle" font-size="9" fill="#fff">${stars}</text>${acc}</g></svg>`}
const TIER={Bronce:['#c98a5a','#7a4a26'],Plata:['#e3e7f3','#8a93b3'],Oro:['#ffd166','#c98a00'],Platino:['#d6f3ff','#6fb5d6'],Diamante:['#8df3ff','#a152ff']};
function medal(t,s,z=64){const [a,b]=TIER[t],id='m'+Math.random().toString(36).slice(2,7);return `<svg width="${z}" height="${z}" viewBox="0 0 72 72" role="img" aria-label="Medalla ${t}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><path d="M36 4l26 12v22c0 14-11 26-26 30C21 64 10 52 10 38V16z" fill="url(#${id})"/><path d="M36 12l18 8v17c0 10-8 19-18 22-10-3-18-12-18-22V20z" fill="#0003"/><text x="36" y="44" text-anchor="middle" font-size="24" fill="#fff">${s}</text></svg>`}

const fmt=n=>n>=1000?(n/1000).toFixed(1)+' k':String(n);
const S={liked:{},saved:{},followed:{},theme:'claro',tab:'Para ti',vtab:'Para ti',pet:{energy:62,joy:84,mood:'happy',hat:false},msgs:{},att:[],draft:'',q:'',ptab:'posts'};
const ago=t=>{const m=Math.floor((Date.now()-t)/60000);if(m<1)return 'ahora';if(m<60)return m+' min';const h=Math.floor(m/60);return h<24?h+' h':Math.floor(h/24)+' d'};
const ACC={violet:['#a152ff','#3d7bff'],blue:['#3d7bff','#00cfff'],cyan:['#00cfff','#3d7bff'],orange:['#ff8a3d','#ff4fa0'],pink:['#ff4fa0','#a152ff'],green:['#2ecc71','#00cfff']};
const API=()=>((window.NV||{}).API||'');
const murl=id=>API()+'/api/media/'+id;
const avatar=(name,id,size=42,acc)=>`<div class="av" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.4)}px;${acc&&ACC[acc]&&!id?'background:linear-gradient(135deg,'+ACC[acc][0]+','+ACC[acc][1]+');':''}">${id?`<img src="${murl(id)}" alt="" loading="lazy">`:esc(((name||'?').trim()[0]||'?').toUpperCase())}</div>`;
const tagify=s=>esc(s).replace(/(^|\s)(#[\p{L}\p{N}_]{2,30})/gu,'$1<button class="tag" data-a="tag" data-t="$2">$2</button>').replace(/(^|\s)@([a-z0-9_.]{3,24})/g,'$1<button class="tag" data-go="user:$2">@$2</button>');
const mediaHtml=p=>{const m=p.media||[];if(!m.length)return '';
 if(m[0].kind==='video')return `<div class="mwrap"><video class="pm" src="${murl(m[0].id)}" controls playsinline preload="metadata" aria-label="Video de @${esc(p.username)}"></video></div>`;
 if(m.length===1)return `<div class="mwrap" data-id="${p.id}"><img class="pm" src="${murl(m[0].id)}" alt="Foto de @${esc(p.username)}" loading="lazy"></div>`;
 return `<div class="mwrap" data-id="${p.id}"><div class="car">${m.map(x=>`<img class="pm" src="${murl(x.id)}" alt="" loading="lazy">`).join('')}</div><span class="cnt">1/${m.length}</span></div>`};
const post=p=>`<article class="card"><div class="row"><button class="row" style="text-align:left" data-go="user:${esc(p.username)}">${avatar(p.display_name,p.avatar_id)}<div><b>${esc(p.display_name)}</b><div class="mute">@${esc(p.username)} · ${ago(p.created_at)}${p.visibility==='private'?' · Solo tú':''}</div></div></button><span class="sp"></span><button class="act" data-a="pmenu" data-id="${p.id}" aria-label="Más opciones">⋯</button></div>${p.body?`<p style="margin:12px 0;white-space:pre-wrap">${tagify(p.body)}</p>`:''}${mediaHtml(p)}<div class="acts"><button class="act" data-a="like" data-id="${p.id}" aria-pressed="${!!p.liked}">${ic('like')}${p.like_count}</button><button class="act" data-a="save" data-id="${p.id}" aria-pressed="${!!p.saved}">${ic('save')}${p.saved?'Guardada':'Guardar'}</button></div></article>`;
const tile=p=>{const m=(p.media||[])[0];return m?`<button class="tl" data-go="post:${p.id}" aria-label="Publicación de @${esc(p.username)}">${m.kind==='video'?`<video src="${murl(m.id)}#t=0.1" muted playsinline preload="metadata"></video><i>▶</i>`:`<img src="${murl(m.id)}" alt="" loading="lazy">`}${p.media.length>1?'<i>❐</i>':''}</button>`:''};
const meter=(l,v)=>`<div class="mute" style="margin-top:6px">${l}</div><div class="bar-meter"><i style="width:${v}%"></i></div>`;
let TOKEN=null,ME=null,FEED=null,FERR=null,PF=null,PFE=null,PU=null,VP=null,VPE=null,EX=null,TR=null,SR=null,PO=undefined,ED=null;
try{TOKEN=localStorage.getItem('nv-token')}catch(e){}
async function api(path,o={}){const base=(window.NV||{}).API||'';if(!base||base.includes('TU-SUBDOMINIO'))throw new Error('Falta configurar la URL del backend en assets/config.js');
 const h={'Content-Type':'application/json'};if(TOKEN)h.Authorization='Bearer '+TOKEN;let res;
 try{res=await fetch(base+path,{method:o.method||'GET',headers:h,body:o.body?JSON.stringify(o.body):undefined})}catch(e){throw new Error('No se pudo conectar con el servidor')}
 let d={};try{d=await res.json()}catch(e){}if(!res.ok){const er=new Error(d.message||'Error inesperado');er.status=res.status;throw er}return d}
async function loadFeed(){FERR=null;try{FEED=(await api('/api/posts')).posts}catch(e){FERR=e.message;FEED=[]}if(cur==='home')go('home')}
let DL=0,sTimer,SET=null,SETE=null,BL=null,RP=null,SL=0,BLL=0,STG=null,STL=0,PS=null,PH=null,AR=null,ARH=null,ARL=0,SSEL=[],SA=null,SVW=null;
const findPosts=id=>[...(FEED||[]),...(PF||[]),...(VP||[]),...(EX||[]),...(SR&&SR.posts?SR.posts:[]),...(PO&&PO.id?[PO]:[])].filter(p=>p.id===id);
function paintPost(p){const q=s=>document.querySelectorAll(s+'[data-id="'+p.id+'"]');
 q('[data-a=like]').forEach(b=>{b.setAttribute('aria-pressed',!!p.liked);b.lastChild.nodeValue=p.like_count});
 q('[data-a=vlike]').forEach(b=>{b.setAttribute('aria-pressed',!!p.liked);b.nextElementSibling.textContent=fmt(p.like_count)});
 q('[data-a=save]').forEach(b=>{b.setAttribute('aria-pressed',!!p.saved);if(!b.closest('.reel'))b.lastChild.nodeValue=p.saved?'Guardada':'Guardar'})}
async function react(a,id,force){const ps=findPosts(id);if(!ps.length)return;const key=a==='like'?'liked':'saved',was=!!ps[0][key];if(force===true&&was)return;
 const up=v=>{ps.forEach(q=>{q[key]=v;if(a==='like')q.like_count+=v?1:-1});paintPost(ps[0])};up(!was);
 try{const x=await api('/api/posts/'+id+'/'+a,{method:'POST'});ps.forEach(q=>{q[key]=x[key];if(a==='like')q.like_count=x.like_count});paintPost(ps[0])}catch(err){up(was);toast('No se pudo completar la acción')}}
async function loadProfile(){const name=cur==='me'?ME.username:cur.split(':')[1];PFE=null;
 try{const e=encodeURIComponent(name),[u,p,ps,ph]=await Promise.all([api('/api/users/'+e),api('/api/posts?user='+e),api('/api/stories/user/'+e).catch(()=>null),api('/api/users/'+e+'/highlights').catch(()=>null)]);if(cur!=='me'&&cur!=='user:'+name)return;PU=u.user;PF=p.posts||[];PS=ps&&ps.stories&&ps.stories.length?ps:null;PH=ph&&ph.highlights?ph.highlights:[]}catch(e){PFE=e.status===404?'Ese usuario no existe':e.message;PF=[]}if(cur==='me'||cur==='user:'+name)go(cur)}
async function loadVideos(){VPE=null;try{VP=((await api('/api/posts?kind=video')).posts||[]).filter(p=>(p.media||[]).some(m=>m.kind==='video'))}catch(e){VPE=e.message;VP=[]}if(cur==='reels')go('reels')}
async function loadDiscover(){if(DL)return;DL=1;try{const [e,t]=await Promise.all([api('/api/posts?kind=media&public=1'),api('/api/trending')]);EX=e.posts||[];TR=t.tags||[]}catch(err){EX=[];TR=[]}DL=0;if(cur==='find')refreshFind()}
async function runSearch(){const el=$('#q'),q=(el?el.value:S.q||'').trim();S.q=q;if(!q){SR=null;refreshFind();return}SR='loading';refreshFind();
 try{const r=await api('/api/search?q='+encodeURIComponent(q));if(S.q===q)SR={users:r.users||[],posts:r.posts||[]}}catch(e){if(S.q===q)SR={users:[],posts:[],err:e.message}}refreshFind()}
const refreshFind=()=>{const e=$('#sres');if(e)e.innerHTML=findBody()};
const findBody=()=>{if(SR==='loading')return '<p class="mute" style="padding:20px 0;text-align:center">Buscando…</p>';
 if(SR){if(SR.err)return `<div class="card mute">${esc(SR.err)}</div>`;
  if(!SR.users.length&&!SR.posts.length)return '<div class="card"><b>Sin resultados</b><p class="mute" style="margin-top:6px">Prueba con otra palabra, un @usuario o una #etiqueta.</p></div>';
  return (SR.users.length?`<h2>Personas</h2>${SR.users.map(u=>`<button class="card row" style="width:100%;text-align:left" data-go="user:${esc(u.username)}">${avatar(u.display_name,u.avatar_id)}<div><b>${esc(u.display_name)}</b><div class="mute">@${esc(u.username)}</div></div></button>`).join('')}`:'')+(SR.posts.length?`<h2>Publicaciones</h2><div class="feed">${SR.posts.map(post).join('')}</div>`:'')}
 return (TR&&TR.length?`<h2>Tendencias</h2><div class="chips">${TR.map(t=>`<button class="chip" data-a="tag" data-t="${esc(t.tag)}">${esc(t.tag)} · ${t.count}</button>`).join('')}</div>`:'')+'<h2>Explorar</h2>'+(EX===null?'<p class="mute">Cargando…</p>':EX.some(p=>(p.media||[]).length)?`<div class="grid">${EX.map(tile).join('')}</div>`:'<div class="card"><b>Todavía no hay fotos ni videos</b><p class="mute" style="margin:6px 0 12px">Sé la primera persona en compartir algo.</p><button class="btn" data-go="create">Crear publicación</button></div>')};
async function loadPost(id){try{PO=(await api('/api/posts/'+id)).post}catch(e){PO=null}if(cur==='post:'+id)go(cur)}
/* ---- ajustes, bloqueos y denuncias ---- */
async function loadSettings(){if(SL)return;SL=1;SETE=null;try{SET=(await api('/api/settings')).settings}catch(e){SETE=e.message}SL=0;if(/^settings/.test(cur))go(cur)}
async function loadBlocked(){BLL=1;try{BL=(await api('/api/blocks')).blocks||[]}catch(e){BL=[];toast(e.message)}BLL=0;if(cur==='settings:blocked')go(cur)}
async function setPref(k,v){const old=SET?SET[k]:undefined;if(SET)SET[k]=v;try{SET=(await api('/api/settings',{method:'PATCH',body:{[k]:v}})).settings}catch(e){if(SET)SET[k]=old;toast(e.message)}if(/^settings/.test(cur))go(cur)}
const lpref=(k,d)=>{try{return localStorage.getItem(k)||d}catch(e){return d}};
function applyPrefs(){const R=document.documentElement;R.style.setProperty('--tz',lpref('nv-tz','1'));R.classList.toggle('rm',lpref('nv-rm','0')==='1')}
function dropUser(u){STG=STG&&STG.filter(g=>g.username!==u);const f=l=>l&&l.filter(p=>p.username!==u);FEED=f(FEED);PF=f(PF);VP=f(VP);EX=f(EX);if(SR&&SR.posts)SR={...SR,posts:f(SR.posts),users:SR.users.filter(x=>x.username!==u)}}
async function blockUser(u){try{await api('/api/blocks',{method:'POST',body:{username:u}});dropUser(u);BL=null;sheet(false);toast('Bloqueaste a @'+u);if(cur==='user:'+u||cur.startsWith('post:'))go('home');else go(cur)}catch(e){toast(e.message)}}
const RSN=[['spam','Spam o publicidad engañosa'],['harassment','Acoso o intimidación'],['hate','Odio o discriminación'],['sexual','Contenido sexual o desnudos'],['violence','Violencia o contenido peligroso'],['selfharm','Autolesión o suicidio'],['minor','Peligro para menores'],['scam','Estafa o fraude'],['illegal','Actividad ilegal'],['ip','Derechos de autor'],['other','Otro motivo']];
const RSN_APP=[['bug','Algo no funciona'],['other','Otro motivo']];
function openMenu(kind,id){const p=kind==='post'?findPosts(id)[0]:null;if(kind==='post'&&!p)return;RP={kind,id,user:kind==='post'?p.username:id,mine:kind==='post'?!!p.mine:false,step:'menu'};sheet(true,'menu')}
function menuPanel(){const r=RP;return `<h2 style="margin:0 0 .5rem">${r.kind==='post'?'Publicación':'@'+esc(r.user)}</h2>`+(r.mine?`<button class="srow" data-a="delpost" data-id="${r.id}" style="color:var(--warm)"><b>Eliminar publicación</b></button>`:`<button class="srow" data-a="rstart" style="color:var(--warm)"><b>Denunciar ${r.kind==='post'?'publicación':'cuenta'}</b></button><button class="srow" data-a="blockask" style="color:var(--warm)"><b>Bloquear a @${esc(r.user)}</b></button>`)+'<button class="srow" data-a="closeSheet"><b>Cancelar</b></button>'}
function reportPanel(){const r=RP,list=r.kind==='app'?RSN_APP:RSN,lab=(list.find(x=>x[0]===r.reason)||[])[1];
 const head=`<div class="row"><h2 style="margin:0">${r.kind==='app'?'Reportar un problema':'Denunciar'}</h2><span class="sp"></span><button class="ib" data-a="closeSheet" aria-label="Cerrar">✕</button></div>`;
 if(r.step==='done')return head+`<p style="margin:1rem 0 .5rem"><b>${r.dup?'Ya habías enviado esto':'Gracias por avisarnos'}</b></p><p class="mute">${r.dup?'Tu denuncia anterior sigue en revisión.':r.kind==='app'?'Revisaremos tu mensaje.':'Una persona del equipo la revisará. La otra persona no sabrá que fuiste tú.'}</p>${r.kind!=='app'&&r.user?`<button class="srow" data-a="blockask" style="color:var(--warm)"><b>Bloquear a @${esc(r.user)}</b></button>`:''}<button class="btn" style="margin-top:1rem;width:100%" data-a="closeSheet">Listo</button>`;
 if(r.step==='details')return head+`<p class="mute" style="margin:.75rem 0">Motivo: <b>${esc(lab)}</b></p>${r.reason==='selfharm'?'<p class="card" style="font-size:.9rem">Si tú o alguien está en peligro ahora mismo, busca ayuda de emergencias de tu país o habla con una persona de confianza.</p>':''}${r.reason==='minor'?'<p class="card" style="font-size:.9rem">Si un menor está en peligro inmediato, contacta a las autoridades de tu país.</p>':''}<textarea id="rdet" rows="3" maxlength="500" placeholder="Añade detalles (opcional)" aria-label="Detalles">${esc(r.details||'')}</textarea><div class="row" style="margin-top:.75rem"><button class="btn ghost" data-a="rback">Atrás</button><button class="btn" style="flex:1" data-a="rsend">Enviar${r.kind==='app'?'':' denuncia'}</button></div>`;
 return head+`<p class="mute" style="margin:.75rem 0 .25rem">${r.kind==='app'?'¿Qué ocurre?':'¿Por qué lo denuncias?'}</p>`+list.map(x=>`<button class="srow" data-a="rsel" data-v="${x[0]}"><b>${x[1]}</b><span class="ch">›</span></button>`).join('')}
async function sendReport(){const r=RP;r.details=($('#rdet')||{}).value||'';const b=$('[data-a=rsend]');if(b)b.disabled=true;
 try{const x=await api('/api/reports',{method:'POST',body:{type:r.kind,target:r.kind==='post'?r.id:r.kind==='user'?r.user:undefined,reason:r.reason,details:r.details}});r.dup=!!x.duplicate;r.step='done';sheet(true,'report')}catch(e){toast(e.message);if(b)b.disabled=false}}
const sBack=(to,t)=>`<div class="row"><button class="ib" data-go="${to}" aria-label="Volver" style="font-size:26px">‹</button><b style="font-size:20px">${t}</b></div>`;

async function shrink(file,max,ratio){if(file.type==='image/gif'&&file.size<=8*1024*1024)return file;
 const bmp=await createImageBitmap(file).catch(()=>null);if(!bmp)throw new Error('No se pudo leer la imagen');
 let sw=bmp.width,sh=bmp.height,sx=0,sy=0;
 if(ratio){const r=sw/sh;if(r>ratio){const nw=sh*ratio;sx=(sw-nw)/2;sw=nw}else{const nh=sw/ratio;sy=(sh-nh)/2;sh=nh}}
 const k=Math.min(1,max/Math.max(sw,sh)),w=Math.round(sw*k),h=Math.round(sh*k),c=document.createElement('canvas');c.width=w;c.height=h;
 c.getContext('2d').drawImage(bmp,sx,sy,sw,sh,0,0,w,h);
 return await new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error('No se pudo procesar la imagen')),'image/jpeg',.85))}
function upload(blob,kind,onp){return new Promise((ok,no)=>{const base=API();if(!base||base.includes('TU-SUBDOMINIO'))return no(new Error('Falta configurar la URL del backend'));
 const x=new XMLHttpRequest();x.open('POST',base+'/api/media?kind='+kind);x.setRequestHeader('Authorization','Bearer '+TOKEN);x.setRequestHeader('Content-Type',blob.type);
 x.upload.onprogress=e=>{if(e.lengthComputable&&onp)onp(Math.round(e.loaded/e.total*100))};
 x.onload=()=>{let d={};try{d=JSON.parse(x.responseText)}catch(_){}x.status===201?ok(d.media):no(new Error(d.message||'No se pudo subir el archivo'))};
 x.onerror=()=>no(new Error('No se pudo conectar con el servidor'));x.send(blob)})}
const vdur=f=>new Promise((ok,no)=>{const v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>{URL.revokeObjectURL(v.src);ok(v.duration)};v.onerror=()=>no(new Error('No se pudo leer el video'));v.src=URL.createObjectURL(f)});

 else if(a==='cam'){try{const s=await navigator.mediaDevices.getUserMedia({video:true,audio:true});const v=document.createElement('video');v.muted=true;v.autoplay=true;v.playsInline=true;v.srcObject=s;$('#lv').replaceChildren(v);toast('Vista previa local activa')}catch(err){toast('Permiso de cámara o micrófono denegado')}}
 else if(a==='vtab'){S.vtab=d.t;go('reels')}
 else if(a==='vmute'){const vs=[...document.querySelectorAll('.reel video')];if(!vs.length){toast('Los videos de ejemplo no tienen sonido');return}const m=!vs[0].muted;vs.forEach(x=>x.muted=m);toast(m?'Sonido desactivado':'Sonido activado')}
 else if(a==='upv')$('#vf').click();
 else if(a==='golive')toast('Transmitir requiere el backend LIVE (Fase 7)');
 else if(a==='del'){const pw=prompt('Para eliminar tu cuenta escribe tu contraseña. Esta acción no se puede deshacer.');if(!pw)return;try{await api('/api/me',{method:'DELETE',body:{password:pw}});toast('Cuenta eliminada');logout()}catch(err){toast(err.message)}}
 else if(a==='menu')toast('Denunciar y bloquear se conectan en la Fase 3');
 else toast('Esta función llega en una fase posterior');

document.addEventListener('change',e=>{const t=e.target,f=t.files;if(t.id==='hl_t'){$('#hl_title').hidden=t.value!=='new';return}if(!f||!f.length)return;
 if(t.id==='fph')addFiles(f,'image');else if(t.id==='fvd')addFiles(f,'video');else if(t.id==='fav')edUpload(f[0],'avatar_id',1,512);else if(t.id==='fbn')edUpload(f[0],'banner_id',3,1500);t.value=''});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='q'){clearTimeout(sTimer);sTimer=setTimeout(runSearch,400)}else if(t.id==='txt'){S.draft=t.value;const sp=$('#sprev');if(sp)sp.innerHTML=storyPrev()}else if(t.id&&t.id.startsWith('ed_')&&ED)ED[t.id.slice(3)]=t.value});
document.addEventListener('scroll',e=>{const c=e.target;if(c.classList&&c.classList.contains('car')){const n=c.nextElementSibling;if(n)n.textContent=(Math.round(c.scrollLeft/c.clientWidth)+1)+'/'+c.children.length}},true);
function spatial(dir){const els=[...document.querySelectorAll('button,input,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled&&x.offsetParent!==null&&x.getBoundingClientRect().width>0);
 const a=document.activeElement,cu=els.includes(a)?a:null;if(!cu){if(els[0])els[0].focus();return}
 const c=cu.getBoundingClientRect(),cx=c.left+c.width/2,cy=c.top+c.height/2;let best=null,bs=1e9;
 for(const x of els){if(x===cu)continue;const q=x.getBoundingClientRect(),dx=q.left+q.width/2-cx,dy=q.top+q.height/2-cy;
  const ok=dir==='ArrowRight'?dx>4&&Math.abs(dy)<=dx*1.5:dir==='ArrowLeft'?dx<-4&&Math.abs(dy)<=-dx*1.5:dir==='ArrowDown'?dy>4&&Math.abs(dx)<=dy*1.5:dy<-4&&Math.abs(dx)<=-dy*1.5;
  if(!ok)continue;const sc=Math.hypot(dx,dy)+((dir==='ArrowLeft'||dir==='ArrowRight')?Math.abs(dy):Math.abs(dx))*2;if(sc<bs){bs=sc;best=x}}
 if(best){best.focus();best.scrollIntoView({block:'nearest',inline:'nearest'})}}
document.addEventListener('keydown',e=>{const t=document.activeElement,typing=t&&/^(INPUT|TEXTAREA)$/.test(t.tagName),dev=document.documentElement.dataset.device;
 if(SVW){if(e.key==='Escape'||e.key==='GoBack'){closeViewer();return}if(e.key==='Enter'&&t&&t.id==='sri'){svReply();return}if(!typing){if(e.key==='ArrowRight'){nextStory();return}if(e.key==='ArrowLeft'){prevStory();return}}}
 if(e.key==='Escape'||e.key==='GoBack'||e.keyCode===10009||e.keyCode===461){const open=$('#bar').classList.contains('on')||$('#sheet').classList.contains('on');bar(false);sheet(false);if(!open&&cur!=='home'&&ME&&(e.key!=='Escape'||dev==='tv'))go('home');return}
 if(e.key==='Enter'&&t&&t.id==='q'){clearTimeout(sTimer);runSearch();return}
 if(typing)return;
 if(cur==='reels'&&['ArrowDown','ArrowUp','j','k','PageDown','PageUp'].includes(e.key)){const rs=$('.reels');if(rs){e.preventDefault();const dn=['ArrowDown','j','PageDown'].includes(e.key);rs.scrollBy({top:(dn?1:-1)*rs.clientHeight,behavior:'smooth'})}return}
 if(dev==='tv'&&e.key.startsWith('Arrow')){e.preventDefault();spatial(e.key)}});
document.addEventListener('dblclick',e=>{const m=e.target.closest('.mwrap[data-id],.reel[data-id]');if(!m||e.target.closest('button,a'))return;const h=document.createElement('div');h.className='pop';h.textContent='♥';m.append(h);setTimeout(()=>h.remove(),700);react('like',m.dataset.id,true)});

 if(TOKEN){try{ME=(await api('/api/me')).user}catch(e){if(e.status===401){TOKEN=null;try{localStorage.removeItem('nv-token')}catch(_){}}}}
 document.body.classList.toggle('noauth',!ME);if(ME)loadSettings();go(h0==='auth'?'home':h0)}
boot();
