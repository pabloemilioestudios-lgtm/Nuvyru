name = "nuvyru-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Dominio(s) del frontend, separados por coma, sin barra final ni ruta del repositorio
ALLOWED_ORIGIN = "https://TU-USUARIO.github.io"

# Pon aquí la D1 que ya usas (npx wrangler d1 list te da el nombre y el id)
[[d1_databases]]
binding = "DB"
database_name = "PENDIENTE"
database_id = "PENDIENTE"

# Fase 4: [[r2_buckets]] binding = "MEDIA", bucket_name = "nuvyru-media"
# Fase 7: Durable Objects para LIVE
# Secretos (nunca aquí): npx wrangler secret put NOMBRE
